services:
  - type: web
    name: ignaciocordoba-backend
    env: python
    region: oregon
    plan: free
    branch: main
    
    rootDir: backend
    
    buildCommand: |
      cd src
      pip install --upgrade pip
      pip install -r ../requirements.txt
    
    startCommand: cd src && python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 23707
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://drhernanignaciocordoba.me
      - key: BACKEND_URL
        value: https://ignaciocordoba-backend.onrender.com

  # Frontend: export estático de Next.js (output: 'export') servido como Static Site.
  # Reemplaza al hosting de Hostinger; cada push a main lo recompila y publica.
  - type: web
    name: ignaciocordoba-frontend
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: out

    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://ignaciocordoba-backend.onrender.com

    routes:
      # Equivalentes a los redirects() de next.config.js, que no corren en un export estático
      - type: redirect
        source: /DashboardHome
        destination: /dashboard
      - type: redirect
        source: /DashboardHome/*
        destination: /dashboard/*
      - type: redirect
        source: /inicio
        destination: /
      # Equivalente al fallback del .htaccess: rutas desconocidas -> index.html
      - type: rewrite
        source: /*
        destination: /index.html
